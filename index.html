<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>스윙바이</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#4428BC">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div class="hud top">
    <button class="btn" id="back" type="button" data-i18n="hud.levels">단계</button>
    <div class="stage" id="stage"><span class="sid"></span><span class="clamp"></span></div>
    <div class="grow"></div>
    <button class="btn" id="hintbtn" type="button"><span data-i18n="hud.hint">힌트</span><i class="dot" hidden></i></button>
    <button class="btn" id="retry" type="button" data-i18n="hud.retry">다시</button>
  </div>

  <div id="hint"></div>
  <div id="angle"></div>
  <div class="sheet" id="result" hidden></div>
  <div class="sheet" id="intro" hidden></div>
  <div class="sheet" id="hints" hidden></div>
  <div class="screen" id="picker" hidden></div>
  <div class="screen" id="settings" hidden></div>
  <div class="screen" id="title" hidden></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
