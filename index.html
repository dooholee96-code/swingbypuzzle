<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M22 16 L8 9 L12 16 L8 23 Z' fill='none' stroke='%23E6EDF5' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>스윙바이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600&display=swap">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#000000">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <div class="hud top">
    <button class="btn" id="back" type="button">단계</button>
    <div class="stage" id="stage"></div>
    <div class="grow"></div>
    <button class="btn" id="hintbtn" type="button">힌트<i class="dot" hidden></i></button>
    <button class="btn" id="retry" type="button">다시</button>
  </div>

  <div id="hint"></div>
  <div id="angle"></div>
  <div class="sheet" id="result" hidden></div>
  <div class="sheet" id="intro" hidden></div>
  <div class="sheet" id="hints" hidden></div>
  <div class="screen" id="picker" hidden></div>
  <div class="screen" id="settings" hidden></div>
  <div class="screen" id="title" hidden></div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
