; 안드로이드 익스포트 프리셋 예시. docs/PLAN.md §15.1, §15.5
;
; 실제 export_presets.cfg 는 **저장소에 커밋하지 않는다**(.gitignore).
; 키스토어 경로와 비밀번호가 기록되기 때문이다. 이 파일을 복사해서 쓴다.
;
;   cp export_presets.example.cfg export_presets.cfg
;
; 그 다음 Godot 에디터 → 프로젝트 → 내보내기 에서 키스토어를 지정한다.
; 업로드 키는 저장소 밖에 보관하고 별도로 백업한다(§15.5).

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="exclude"
; 배포 빌드에 들어가면 안 되는 것들 (§19, §15.1)
;
; tools_shared/ 는 일부러 남겨 둔다. scan.gd 가 class_name 을 가지고 있어서
; 빼면 전역 클래스 캐시가 없는 파일을 가리키게 된다. 파일 하나뿐이라
; 설치 크기에 영향이 없다. tests/ 와 tools/ 는 class_name 이 없어 안전하다.
exclude_filter="addons/swingby_editor/*, addons/gdUnit4/*, tests/*, tools/*, recipes/*, candidates/*, docs/*, *.md, export_presets*.cfg, run.sh, run.ps1"
include_filter=""
export_path="build/swingby.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""

; §15.1: arm64 단독. armeabi-v7a 를 빼서 설치 크기를 줄인다(§18 목표 35MB).
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

; 서명 — 아래 네 줄은 **각자 환경에서 채우고 커밋하지 않는다**.
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""

version/code=1
version/name="0.1.0"
package/unique_name="com.example.swingby"      ; 출시 전 사용자와 확정 (§15.1)
package/name="스윙바이"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false

launcher_icons/main_192x192=""                 ; M12 에서 채운다 (§15.4)
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""

; §15.1 세로 고정
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

; 게임은 개인정보를 직접 수집·전송하지 않는다 (§14.5).
; 광고 SDK 를 붙이는 M9 에서 INTERNET 권한이 필요해진다.
permissions/internet=false

; ─────────────────────────────────────────────────────────────────────────
; 웹(HTML5) — **개발 중 확인용**이다. 출시 형태가 아니다(§20).
;
; 폰에서 확인하는 가장 빠른 길:
;   ./run.sh serve
; 그러면 내보내고 로컬 서버를 띄운다. 같은 Wi-Fi 의 폰에서 표시된 주소로 접속한다.
;
; 조건: Compatibility 렌더러(이미 §15.1 에서 그렇게 두었다)와
;       thread_support=false. 스레드를 켜면 호스팅에 COOP/COEP 헤더가 필요해진다.

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="exclude"
exclude_filter="addons/swingby_editor/*, addons/gdUnit4/*, tests/*, tools/*, recipes/*, candidates/*, docs/*, *.md, export_presets*.cfg, run.sh, run.ps1, *.py"
include_filter=""
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
